[project]
name = "gpu-video-pipeline"
version = "0.1.0"
description = "Experimental NVDEC-to-PyTorch movie indexing pipeline"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2,<3",
    "pynvvideocodec>=2.2,<3",
    "torch>=2.8,<3",
]

[project.scripts]
gpu-video-index = "gpu_video_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_video_pipeline"]
